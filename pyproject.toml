[project]
name = "supermimic-mjlab"
version = "0.1.0"
description = "Independent SuperMimic LAFAN1 reproduction on native mjlab"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "mjlab==1.6.0", "torch==2.11.0", "mujoco==3.11.0",
  "mujoco-warp==3.11.0", "warp-lang==1.14.0",
  "scipy>=1.14,<2", "huggingface-hub>=1.0,<2", "numpy>=2,<3", "matplotlib>=3.10,<4", "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cu128", marker = "sys_platform == 'linux'"}]
warp-lang = [{index = "nvidia", marker = "sys_platform == 'linux'"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
